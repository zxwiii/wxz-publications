name: 自动同步王小治课题组学术成果 (Sync WoS & Mirror to Gitee)

on:
  schedule:
    # 每月 2 号与 16 号北京时间上午 10:00 (UTC 02:00) 自动定时触发
    - cron: '0 2 2,16 * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面随时手动一键点击触发

# 赋予 GitHub Actions 写回仓库内容的权限 (解决 403 Permission denied 错误)
permissions:
  contents: write

jobs:
  sync-and-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前 GitHub 仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行 Web of Science 双 Key 智能轮换拉取与防截断同步
        env:
          # 从 GitHub 仓库安全 Secrets 注入，支持单变量逗号分隔或多变量
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          WOS_API_KEYS: ${{ secrets.WOS_API_KEYS }}
          WOS_API_KEY_1: ${{ secrets.WOS_API_KEY_1 }}
          WOS_API_KEY_2: ${{ secrets.WOS_API_KEY_2 }}
          RESEARCHER_ID: "PDX-5463-2025"
        run: |
          python sync_wos.py
          if [ -f "build_preview.py" ]; then
            python build_preview.py || true
          fi

      - name: 提交并推送更新至 GitHub 主仓库
        id: git-push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch wos_keys.json wos_secrets.local.json || true
          git add publications.json publications_data.js impact_data.js impact_metrics.json wos_fixed_metadata.json crossref_cache.json corresponding_titles.txt selected_doi.txt esi_top_1_percent.txt
          git add preview_all.html 凡科_*.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes detected. Everything is up to date."
          else
            git commit -m "Auto sync publications & impact metrics from Web of Science [skip ci]"
            git push origin HEAD
          fi

      - name: 镜像同步至 Gitee 双分支 (master & main)
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -n "$GITEE_USER" ] && [ -n "$GITEE_TOKEN" ]; then
            REPO_NAME="${GITEE_REPO:-wxz-publications}"
            echo "Mirroring repository to Gitee (${GITEE_USER}/${REPO_NAME})..."
            git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${REPO_NAME}.git" || true
            git push -f gitee HEAD:master || true
            git push -f gitee HEAD:main || echo "Gitee push completed"
          else
            echo "未检测到 GITEE_USER / GITEE_TOKEN，跳过 Gitee 镜像推送"
          fi

      - name: 实时刷新全球 jsDelivr CDN 缓存 (Purge Global CDN Cache)
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/impact_data.js" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/publications_data.js" || true
